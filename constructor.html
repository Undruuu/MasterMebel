<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Конструктор мебели - Собирай сам</title>
    <link rel="stylesheet" href="css/constructor.css">
</head>
<body>
    <div id="info">
        Режим: <strong>Сборка мебели</strong> Клик - выделить | Move/Scale - трансформация
    </div>
    
    <button class="home-button" id="home-button">На главную</button>
    
    <div id="controls-panel">
        <div class="panel-section">
            <div class="panel-title">Управление</div>
            <button id="btn-translate" class="active">Перемещать</button>
            <button id="btn-scale">Масштабировать</button>
            <button id="btn-reset-camera">Сброс камеры</button>
            <button id="btn-toggle-grid">Сетка: Вкл</button>
            <button id="btn-clear-all">Очистить всё</button>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">Элементы шкафа</div>
            <button id="btn-add-left-wall">Левая стенка</button>
            <button id="btn-add-right-wall">Правая стенка</button>
            <button id="btn-add-back-wall">Задняя стенка</button>
            <button id="btn-add-top">Верх</button>
            <button id="btn-add-bottom">Низ</button>
            <button id="btn-add-shelf">Полка</button>
            <button id="btn-add-door">Дверь</button>
            <button id="btn-add-drawer">Ящик</button>
            <button id="btn-add-divider">Перегородка</button>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">Готовые варианты</div>
            <button id="btn-preset-classic">Классический шкаф</button>
            <button id="btn-preset-wardrobe">Шкаф-купе</button>
            <button id="btn-preset-corner">Угловая секция</button>
            <button id="btn-preset-drawer">Тумба с ящиками</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/constructor-main.js"></script>
</body>
</html>
